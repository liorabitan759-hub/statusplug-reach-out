name: Deploy to Pages
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Fix dist
        run: |
          echo "--- WHERE IS BUILD OUTPUT? ---"
          ls -la
          ls -la.output 2>&1 || echo "no.output"
          ls -la.output/public 2>&1 || echo "no.output/public"
          ls -la dist 2>&1 || echo "no dist yet"
          mkdir -p dist
          if [ -d ".output/public" ]; then cp -rv.output/public/* dist/; fi
          if [ -d "dist/client" ]; then cp -rv dist/client/* dist/ 2>/dev/null; rm -rf dist/client dist/server 2>/dev/null || true; fi
          touch dist/.nojekyll
          echo "--- FINAL dist ---"
          ls -la dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
