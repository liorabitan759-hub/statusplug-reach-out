name: Deploy React/Vite site to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Find build output
        run: |
          ls -la
          echo "--- finding build folder ---"
          ls -la dist 2>&1 || echo "no dist"
          ls -la .output 2>&1 || echo "no .output"
          ls -la .output/public 2>&1 || echo "no .output/public"
          ls -la build 2>&1 || echo "no build"
          ls -la dist/client 2>&1 || echo "no dist/client"
          # find the real folder
          if [ -f dist/index.html ]; then
            echo "FOUND dist"
            echo "statusplug.online" > dist/CNAME
            cp dist/index.html dist/404.html
            echo "OUT=dist" >> $GITHUB_ENV
          elif [ -f .output/public/index.html ]; then
            echo "FOUND .output/public"
            echo "statusplug.online" > .output/public/CNAME
            cp .output/public/index.html .output/public/404.html
            echo "OUT=.output/public" >> $GITHUB_ENV
          elif [ -f dist/client/index.html ]; then
            echo "FOUND dist/client"
            echo "statusplug.online" > dist/client/CNAME
            cp dist/client/index.html dist/client/404.html
            echo "OUT=dist/client" >> $GITHUB_ENV
          elif [ -f build/client/index.html ]; then
            echo "FOUND build/client"
            echo "statusplug.online" > build/client/CNAME
            cp build/client/index.html build/client/404.html
            echo "OUT=build/client" >> $GITHUB_ENV
          else
            echo "Searching..."
            find . -name index.html | head -20
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
