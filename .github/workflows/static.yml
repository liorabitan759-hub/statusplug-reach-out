name: Deploy React/Vite site to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Prepare
        run: |
          ls -la
          ls -la dist || true
          ls -la .output/public || true
          if [ -f dist/index.html ]; then echo "statusplug.online" > dist/CNAME; cp dist/index.html dist/404.html; echo "OUT=dist" >> $GITHUB_ENV
          elif [ -f .output/public/index.html ]; then echo "statusplug.online" > .output/public/CNAME; cp .output/public/index.html .output/public/404.html; echo "OUT=.output/public" >> $GITHUB_ENV
          else echo "statusplug.online" > dist/client/CNAME; cp dist/client/index.html dist/client/404.html; echo "OUT=dist/client" >> $GITHUB_ENV
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
