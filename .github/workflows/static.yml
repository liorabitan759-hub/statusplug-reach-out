name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx vite build --outDir dist || bun run build
      - run: |
          ls -la
          mkdir -p dist
          ls -la .output/public || true
          cp -r .output/public/* dist/ 2>/dev/null || true
          ls -la dist
          echo "statusplug.online" > dist/CNAME
          cp dist/index.html dist/404.html 2>/dev/null || echo "no index.html yet"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
