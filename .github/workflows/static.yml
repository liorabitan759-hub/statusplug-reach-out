name: Deploy React/Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install

      - name: Build
        run: bun run build

      - name: Fix for Pages
        run: |
          ls -la
          ls -la .output/public || true
          ls -la dist || true
          ls -la dist/client || true
          if [ -f .output/public/index.html ]; then
            cp .output/public/index.html .output/public/404.html
            echo "statusplug.online" > .output/public/CNAME
            echo "OUTPUT=.output/public" >> $GITHUB_ENV
          elif [ -f dist/client/index.html ]; then
            cp dist/client/index.html dist/client/404.html
            echo "statusplug.online" > dist/client/CNAME
            echo "OUTPUT=dist/client" >> $GITHUB_ENV
          else
            cp dist/index.html dist/404.html
            echo "statusplug.online" > dist/CNAME
            echo "OUTPUT=dist" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
