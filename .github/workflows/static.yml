name: Deploy to Pages
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Fix dist
        run: |
          mkdir -p dist
          ls -la
          ls -la.output 2>&1 || true
          ls -la.output/public 2>&1 || true
          if [ -d ".output/public" ]; then cp -r.output/public/* dist/; fi
          if [ -d "dist/client" ]; then cp -r dist/client/* dist/; rm -rf dist/client dist/server || true; fi
          touch dist/.nojekyll
          ls -la dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
